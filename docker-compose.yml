services:
  frontend:
    build:
      context: ./station-ski-ui
      dockerfile: Dockerfile
    image: station-ski-ui:latest
    container_name: station-ski-ui
    ports:
      - "8082:80"
    restart: unless-stopped

  backend:
    image: gestion-station-skii:latest
    container_name: station-ski-backend
    ports:
      - "8080:8080"
    restart: unless-stopped

